<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<title>컨택싱어 관리자</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<a class="skip" href="#view">본문 바로가기</a>

<!-- 로그인 -->
<main class="login" id="login" hidden>
  <form class="login-card" id="login-form" novalidate>
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="22" height="16" viewBox="0 0 28 20"><circle cx="10" cy="10" r="7.6" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="18" cy="10" r="7.6" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M14 3.7A7.6 7.6 0 0 1 14 16.3A7.6 7.6 0 0 1 14 3.7Z" fill="#fff"/></svg></span><b>컨택싱어</b><span class="tag">관리자</span></div>
    <h1>관리자 로그인</h1>
    <label class="fld"><span>이메일</span><input type="email" id="lg-email" autocomplete="username" required></label>
    <label class="fld"><span>비밀번호</span><input type="password" id="lg-pw" autocomplete="current-password" required></label>
    <p class="err" id="lg-err" role="alert" hidden></p>
    <button type="submit" class="btn primary block" id="lg-btn">로그인</button>
    <p class="hint">관리자 계정은 Supabase에서 만들고, 관리자 명단(admins)에 등록된 계정만 들어올 수 있어요.</p>
  </form>
</main>

<!-- 관리자 화면 -->
<div class="shell" id="shell" hidden>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="20" height="14" viewBox="0 0 28 20"><circle cx="10" cy="10" r="7.6" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="18" cy="10" r="7.6" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M14 3.7A7.6 7.6 0 0 1 14 16.3A7.6 7.6 0 0 1 14 3.7Z" fill="#fff"/></svg></span><b>컨택싱어</b><span class="tag">관리자</span></div>
    <span class="grow"></span>
    <a class="btn ghost sm" id="open-app" target="_blank" rel="noopener">앱 열기</a>
    <span class="who" id="who"></span>
    <button type="button" class="btn ghost sm" id="logout">로그아웃</button>
  </header>
  <nav class="side" aria-label="관리 메뉴">
    <a href="#dashboard" data-nav="dashboard">대시보드</a>
    <a href="#venues" data-nav="venues">라이브바 사장님</a>
    <a href="#artists" data-nav="artists">가수</a>
    <a href="#fans" data-nav="fans">손님</a>
    <a href="#bookings" data-nav="bookings">예약</a>
    <a href="#contacts" data-nav="contacts">컨택 요청</a>
    <a href="#clips" data-nav="clips">피드 영상</a>
    <a href="#shows" data-nav="shows">공연 일정</a>
    <a href="#gigs" data-nav="gigs">빈 무대 공고</a>
    <a href="#tips" data-nav="tips">현장 팁</a>
    <a href="#popups" data-nav="popups">팝업</a>
    <a href="#notify_log" data-nav="notify_log">알림 기록</a>
    <a href="#settings" data-nav="settings">앱 설정</a>
  </nav>
  <main class="view" id="view" tabindex="-1"></main>
</div>

<!-- 상세 보기 · 편집 패널 -->
<div class="drawer-bg" id="drawer-bg" hidden>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title">
    <header class="dr-hd"><h2 id="dr-title"></h2><button type="button" class="icon-btn" id="dr-close" aria-label="닫기">&times;</button></header>
    <div class="dr-body" id="dr-body"></div>
  </aside>
</div>

<!-- 확인 창 -->
<div class="modal-bg" id="confirm" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="cf-t" aria-describedby="cf-m">
    <h2 id="cf-t"></h2><p id="cf-m"></p>
    <div class="row end"><button type="button" class="btn ghost" id="cf-no">취소</button><button type="button" class="btn danger" id="cf-yes">확인</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">관리자 화면은 자바스크립트를 켜야 동작해요.</p></noscript>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
